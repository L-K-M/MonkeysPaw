name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full-ci:
        description: Run every job for reusable callers, including release PR dry runs
        type: boolean
        default: true

# Least privilege: builds and tests only need to read repository contents.
permissions:
  contents: read

# Separate ordinary CI from release calls; cancel superseded PR runs only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a timeout so a wedged build cannot consume the default six hours.
jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      core-linux: ${{ steps.select.outputs.core-linux }}
      linux-app: ${{ steps.select.outputs.linux-app }}
      deb: ${{ steps.select.outputs.deb }}
      android: ${{ steps.select.outputs.android }}
      core-macos: ${{ steps.select.outputs.core-macos }}
      macos-app: ${{ steps.select.outputs.macos-app }}
      macos-artifacts: ${{ steps.select.outputs.macos-artifacts }}
      server: ${{ steps.select.outputs.server }}
      server-image: ${{ steps.select.outputs.server-image }}
      compose-smoke: ${{ steps.select.outputs.compose-smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both PR SHAs and their merge base must be available, including forks.
          fetch-depth: 0
      - name: Select jobs from changed paths
        id: select
        env:
          # Reusable workflows retain the caller's event, which can be a PR.
          CI_EVENT_NAME: ${{ inputs.full-ci && 'workflow_call' || github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-changes.py

  core-linux:
    name: Core on Linux
    needs: changes
    if: needs.changes.outputs.core-linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    # This is the portability gate: Core must build without Apple or GTK APIs.
    steps:
      # Immutable action SHAs prevent a mutable tag from changing executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure project validation tools
        run: |
          command -v python3 || {
            apt-get update
            apt-get install -y --no-install-recommends python3
          }
      - name: Validate Xcode object references
        run: python3 scripts/check-pbxproj.py
      - name: Check committed versions and Debian version mapping
        run: python3 scripts/check-version.py
      - name: Test packaging scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build Core
        run: swift build --target MonkeysPawCore
      # swift test builds every test target, even with --filter. Compile Core
      # tests without GTK here; run them in linux-app below.
      - name: Build Core tests without GTK
        run: swift build --target MonkeysPawCoreTests

  linux-app:
    name: Linux GTK app
    needs: changes
    if: needs.changes.outputs.linux-app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and display test tools
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev xvfb xauth desktop-file-utils dbus \
            libglib2.0-bin xdotool xterm openbox x11-utils python3
      - name: Build Linux app
        run: swift build --product monkeyspaw
      # One unfiltered run: --filter expands to every matching test name in a
      # single runner argument, which exceeds Linux's 128 KiB per-argument limit.
      - name: Test Core and Linux app with a required display and portal bus
        env:
          MONKEYSPAW_REQUIRE_DISPLAY: '1'
          # Enable fake portal ownership only on this private D-Bus session.
          MONKEYSPAW_REQUIRE_PORTAL_BUS: '1'
          # Keep settings in memory instead of using the host's dconf storage.
          GSETTINGS_BACKEND: memory
          # Disable accessibility bus discovery in this isolated test session.
          GTK_A11Y: none
          # Use software rendering so Xvfb needs no GL or GPU support.
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: dbus-run-session -- xvfb-run -a swift test
      - name: Test filesystem permissions as an unprivileged user
        shell: bash
        env:
          MONKEYSPAW_REQUIRE_DISPLAY: '1'
          MONKEYSPAW_REQUIRE_PORTAL_BUS: '1'
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: |
          set -euo pipefail
          # This job runs as root inside the swift:6.4-noble container.
          useradd --create-home --shell /bin/bash monkeyspaw-tests
          test "$(id -u monkeyspaw-tests)" -ne 0
          chown -R monkeyspaw-tests:monkeyspaw-tests .build
          # Every test that skips as root. Each must report passed; XCTest may
          # print one summary per test target, so counts are not compared.
          tests=(
            RootedFileStoreTests/testInitializationErrorsDoNotExposeOSPaths
            RootedFileWatcherTests/testRescanFailuresLogOncePerStreakAndKeepBaselineAndMonitoring
            RootedFileWatcherHealthTests/testUnreadableRootReportsUnavailableOnce
            ValuesStoreFileTests/testGlobalResetRecoversUnreadableRegularFileWithoutReadingIt
            LinuxForgetControlsTests/testUnreadableValuesShowTypedFailuresAndRecover
            LinuxLibrarySwitchTests/testUnreadableTargetIsRejectedWithoutStoppingTheOldWatcher
            LinuxLibrarySwitchTests/testSettingsWriteFailureKeepsNewGraphForTheSessionAndReportsTheError
            LinuxSecretStoreTests/testFailedFileCleanupRestoresThePreviousServiceValue
            LinuxSecretStoreTests/testFailedFileCleanupClearsANewServiceItemWhenThePreviousTierWasFile
            LinuxOnboardingTests/testUnreadableChosenFolderOpensRecoveryAndCanUseTheDefault
            LinuxOnboardingTests/testSeedWriteFailureShowsTypedCopyAndDoesNotRepeatAfterRestart
            LinuxOnboardingTests/testFailedSeedOfferRecordingCopiesNothingAndLeavesTheOfferPending
            LinuxOnboardingTests/testTourWriteFailureKeepsDoneAndClosePendingUntilRetry
            FileLogSinkTests/testUnwritableDirectoryReportsOnceAndOtherSinksKeepReceivingRecords
            FileLogSinkTests/testUnwritableFilePreservesExistingBytesAndReportsOnce
          )
          filter=$(IFS='|'; echo "${tests[*]}")
          # SwiftPM keeps its workspace lock in TMPDIR; root's lock in /tmp is
          # unusable. The GTK cases need the private bus and display.
          runuser -u monkeyspaw-tests -- env TMPDIR=/home/monkeyspaw-tests \
            dbus-run-session -- xvfb-run -a swift test --skip-build --filter "$filter" \
            2>&1 | tee permission-tests.log
          for test in "${tests[@]}"; do
            grep -qF "Test Case '${test/\//.}' passed" permission-tests.log
          done
          ! grep -E "Test Case '.*' (skipped|failed)" permission-tests.log
      - name: Smoke X11 delivery and CLI self-test
        env:
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          XDG_SESSION_TYPE: x11
          XDG_CURRENT_DESKTOP: MONKEYSPAW_CI
        run: |
          timeout 60s dbus-run-session -- xvfb-run -a \
            bash scripts/linux-delivery-smoke.sh .build/debug/monkeyspaw
      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/ch.lkmc.monkeyspaw.desktop

  deb:
    name: Ubuntu 24.04 Debian package
    needs: changes
    if: needs.changes.outputs.deb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Debian package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config python3 dpkg-dev binutils desktop-file-utils shellcheck
      - name: Check packaging scripts
        run: |
          shellcheck packaging/build-deb.sh scripts/make-linux-icons.sh
          python3 scripts/check-version.py
      - name: Test server updater
        run: |
          shellcheck update.sh scripts/tests/test-update.sh
          shellcheck --shell=sh update.sh scripts/tests/test-update.sh
          bash scripts/tests/test-update.sh
          UPDATE_TEST_SHELL=dash dash scripts/tests/test-update.sh
      - name: Test server backup wrapper
        run: |
          shellcheck scripts/backup.sh scripts/tests/test-backup.sh
          bash scripts/tests/test-backup.sh
      - name: Build a prerelease package
        # A fixed version exercises the tilde mapping without bumping the repo.
        run: packaging/build-deb.sh v0.1.0-beta.1
      - name: Inspect package metadata and payload
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          deb='dist/monkeyspaw_0.1.0~beta.1_amd64.deb'
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = monkeyspaw
          test "$(dpkg-deb --field "$deb" Version)" = '0.1.0~beta.1'
          test "$(dpkg-deb --field "$deb" Architecture)" = "$(dpkg --print-architecture)"
          test "$(dpkg-deb --field "$deb" Section)" = utils
          test "$(dpkg-deb --field "$deb" Priority)" = optional
          test "$(dpkg-deb --field "$deb" Maintainer)" = 'L-K-M <noreply@lkmc.ch>'
          test "$(dpkg-deb --field "$deb" Recommends)" = 'libsecret-tools, ydotool, xdotool'
          test "$(dpkg-deb --field "$deb" Installed-Size)" -gt 0
          test -n "$(dpkg-deb --field "$deb" Description)"
          depends="$(dpkg-deb --field "$deb" Depends)"
          for dependency in libgtk-4-1 libglib2.0-0t64 libglib2.0-bin; do
            grep -Eq "(^|, )${dependency}( |,|$)" <<< "$depends"
          done

          dpkg-deb --contents "$deb"
          payload="$RUNNER_TEMP/monkeyspaw-deb"
          dpkg-deb --extract "$deb" "$payload"
          test -x "$payload/usr/bin/monkeyspaw"
          cmp packaging/linux/ch.lkmc.monkeyspaw.desktop \
            "$payload/usr/share/applications/ch.lkmc.monkeyspaw.desktop"
          cmp packaging/linux/ch.lkmc.monkeyspaw.service \
            "$payload/usr/share/dbus-1/services/ch.lkmc.monkeyspaw.service"
          cmp packaging/debian/copyright "$payload/usr/share/doc/monkeyspaw/copyright"
          test -s "$payload/usr/share/doc/monkeyspaw/changelog.gz"
          for size in 16 24 32 48 64 128 256 512; do
            icon="icons/hicolor/${size}x${size}/apps/ch.lkmc.monkeyspaw.png"
            cmp "packaging/$icon" "$payload/usr/share/$icon"
          done

          readelf -d "$payload/usr/bin/monkeyspaw"
          dynamic="$(ldd "$payload/usr/bin/monkeyspaw")"
          printf '%s\n' "$dynamic"
          if grep -Eq 'lib(swift|Foundation|CoreFoundation|dispatch|BlocksRuntime|_)|not found' <<< "$dynamic"; then
            echo 'Swift/Foundation must be static and system libraries must resolve' >&2
            exit 1
          fi
      - name: Install and check the packaged version
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends './dist/monkeyspaw_0.1.0~beta.1_amd64.deb'
          command -v gapplication
          version="$(/usr/bin/monkeyspaw --version)"
          printf '%s\n' "$version"
          test "$version" = 'monkeyspaw 0.1.0-beta.1'
          (cd dist && sha256sum -c 'monkeyspaw_0.1.0~beta.1_amd64.deb.sha256')
      - name: Upload the tested amd64 deb and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-tested-deb
          path: |
            dist/monkeyspaw_0.1.0~beta.1_amd64.deb
            dist/monkeyspaw_0.1.0~beta.1_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 3

  flatpak:
    name: GNOME 50 Flatpak from the tested deb
    needs: deb
    # bubblewrap's unprivileged user namespaces require the bare runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ch.lkmc.monkeyspaw
      ARTIFACT_VERSION: '0.1.0-beta.1'
      DEB_FILE: 'monkeyspaw_0.1.0~beta.1_amd64.deb'
      BUNDLE_FILE: 'monkeyspaw_0.1.0-beta.1_x86_64.flatpak'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch this run's tested Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-tested-deb
          path: ${{ runner.temp }}/monkeyspaw-tested-deb
      - name: Install Flatpak and sandbox verification tools
        run: |
          # runner context is unavailable in job-level env. Set these from
          # the runner's shell environment and persist them for later steps.
          export XDG_DATA_HOME="$RUNNER_TEMP/monkeyspaw-flatpak-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/monkeyspaw-flatpak-runtime"
          printf 'XDG_DATA_HOME=%s\nXDG_RUNTIME_DIR=%s\n' "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder \
            dbus libglib2.0-bin xvfb xauth x11-utils xdotool desktop-file-utils shellcheck python3 python3-yaml
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          # Relax only this Ubuntu knob, only on this disposable runner, and
          # restore its original value in the always() cleanup step below.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              > "$RUNNER_TEMP/monkeyspaw-flatpak-userns"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          timeout 10s bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /usr/bin/true
      - name: Check the manifest and packaging script
        run: |
          shellcheck scripts/build-flatpak.sh scripts/tests/test-build-flatpak.sh
          bash -n scripts/build-flatpak.sh scripts/tests/test-build-flatpak.sh
          bash scripts/tests/test-build-flatpak.sh
          flatpak-builder --show-manifest "flatpak/$APP_ID.yml" >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path('flatpak/' + os.environ['APP_ID'] + '.yml').read_text())
          assert manifest['id'] == os.environ['APP_ID']
          assert (manifest['runtime'], manifest['runtime-version'], manifest['sdk'], manifest['command']) == (
              'org.gnome.Platform', '50', 'org.gnome.Sdk', 'monkeyspaw')
          assert set(manifest['finish-args']) == {
              '--share=ipc', '--share=network', '--socket=wayland', '--socket=fallback-x11',
              '--filesystem=home', '--talk-name=org.freedesktop.secrets'}
          assert manifest['build-options']['no-debuginfo'] is True
          assert manifest['build-options']['strip'] is False
          assert len(manifest['modules']) == 1
          module = manifest['modules'][0]
          assert module['only-arches'] == ['x86_64'] and module['buildsystem'] == 'simple'
          assert module['sources'] == [{'type': 'dir', 'path': 'stage'}]
          assert module['build-commands'] == ['cp -a . /app/']
          PY
      - name: Install the exact GNOME 50 Platform and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          timeout --kill-after=10s 15m dbus-run-session -- \
            flatpak install --user --noninteractive --assumeyes --arch=x86_64 flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Repack the explicit tested deb and install the bundle
        run: |
          (cd "$RUNNER_TEMP/monkeyspaw-tested-deb" && sha256sum -c "$DEB_FILE.sha256")
          dbus-run-session -- scripts/build-flatpak.sh \
            "$RUNNER_TEMP/monkeyspaw-tested-deb/$DEB_FILE" "$ARTIFACT_VERSION"
          (cd dist && sha256sum -c "$BUNDLE_FILE.sha256")
          dbus-run-session -- flatpak install --user --noninteractive --assumeyes "dist/$BUNDLE_FILE"
      - name: Compare the installed payload and exported identity
        run: |
          set -euo pipefail
          payload=$(mktemp -d "$RUNNER_TEMP/monkeyspaw-flatpak-payload.XXXXXX")
          trap 'rm -rf -- "$payload"' EXIT
          dpkg-deb --extract "$RUNNER_TEMP/monkeyspaw-tested-deb/$DEB_FILE" "$payload"
          deployment=$(flatpak info --user --show-location "$APP_ID")
          test "$(flatpak info --user --show-runtime "$APP_ID")" = org.gnome.Platform/x86_64/50
          cmp "$payload/usr/bin/monkeyspaw" "$deployment/files/bin/monkeyspaw"
          cmp "$payload/usr/share/doc/monkeyspaw/copyright" "$deployment/files/share/doc/monkeyspaw/copyright"
          export_root="$XDG_DATA_HOME/flatpak/exports/share"
          desktop-file-validate "$export_root/applications/$APP_ID.desktop"
          grep -Fxq 'Exec=/app/bin/monkeyspaw --gapplication-service' \
            "$deployment/files/share/dbus-1/services/$APP_ID.service"
          for size in 16 24 32 48 64 128 256 512; do
            icon="icons/hicolor/${size}x${size}/apps/$APP_ID.png"
            cmp "$payload/usr/share/$icon" "$deployment/files/share/$icon"
            cmp "$payload/usr/share/$icon" "$export_root/$icon"
          done
          python3 - "$deployment/metadata" "$export_root" <<'PY'
          import configparser
          import os
          from pathlib import Path
          import shlex
          import sys

          def read(path):
              config = configparser.ConfigParser(interpolation=None)
              config.optionxform = str
              with open(path) as file:
                  config.read_file(file)
              return config

          app_id = os.environ['APP_ID']
          metadata = read(sys.argv[1])
          assert metadata['Application']['name'] == app_id
          assert metadata['Application']['command'] == 'monkeyspaw'
          assert set(metadata['Context']['shared'].strip(';').split(';')) == {'ipc', 'network'}
          assert set(metadata['Context']['sockets'].strip(';').split(';')) == {'wayland', 'fallback-x11'}
          assert metadata['Context']['filesystems'] == 'home;'
          assert not metadata['Context'].get('devices')
          assert dict(metadata['Session Bus Policy']) == {'org.freedesktop.secrets': 'talk'}
          assert not metadata.has_section('System Bus Policy')
          exports = Path(sys.argv[2])
          desktop = read(exports / 'applications' / (app_id + '.desktop'))
          entry = desktop['Desktop Entry']
          assert entry['Icon'] == entry['StartupWMClass'] == app_id
          assert entry['DBusActivatable'] == 'true'
          command = shlex.split(entry['Exec'])
          assert Path(command[0]).name == 'flatpak' and app_id in command
          assert '--command=monkeyspaw' in command
          native = read('packaging/linux/' + app_id + '.desktop')
          assert entry['Actions'] == native['Desktop Entry']['Actions']
          for action in entry['Actions'].strip(';').split(';'):
              command = shlex.split(desktop['Desktop Action ' + action]['Exec'])
              assert '--command=gapplication' in command and command[-3:] == ['action', app_id, action]
          service = read(exports / 'dbus-1/services' / (app_id + '.service'))['D-BUS Service']
          assert service['Name'] == app_id
          command = shlex.split(service['Exec'])
          assert Path(command[0]).name == 'flatpak' and app_id in command
          assert any(value in command for value in ('--command=monkeyspaw', '--command=/app/bin/monkeyspaw'))
          assert command[-1] == '--gapplication-service'
          PY
      - name: Check Platform tools and launch with a required display and private bus
        run: |
          timeout --kill-after=5s 60s dbus-run-session -- xvfb-run -a bash <<'SH'
          set -euo pipefail
          test -n "${DISPLAY:-}"
          xdpyinfo -display "$DISPLAY" >/dev/null
          # The installed app uses Platform, without --devel or permission overrides.
          # shellcheck disable=SC2016
          flatpak run --user --die-with-parent --command=sh "$APP_ID" -eu -c '
            command -v secret-tool
            command -v gsettings
            dependencies=$(ldd /app/bin/monkeyspaw)
            printf "%s\n" "$dependencies"
            case "$dependencies" in *"not found"*) exit 1 ;; esac
            test "$(LD_BIND_NOW=1 /app/bin/monkeyspaw --version)" = "monkeyspaw $1"
          ' _ "$ARTIFACT_VERSION"
          app_pid=
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 ]]; then cat "$RUNNER_TEMP/monkeyspaw-flatpak-launch.log" >&2 || true; fi
            timeout 5s flatpak kill "$APP_ID" >/dev/null 2>&1 || true
            if [[ -n "$app_pid" ]]; then
              kill -KILL "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          flatpak run --user --die-with-parent --env=GTK_A11Y=none --env=GSK_RENDERER=cairo \
            --env=GSETTINGS_BACKEND=memory --env=GDK_BACKEND=x11 "$APP_ID" --gapplication-service \
            > "$RUNNER_TEMP/monkeyspaw-flatpak-launch.log" 2>&1 &
          app_pid=$!
          ready=false
          for ((attempt=0; attempt<20; attempt++)); do
            kill -0 "$app_pid"
            owner=$(timeout 2s gdbus call --session --dest org.freedesktop.DBus \
              --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner "$APP_ID")
            if [[ "$owner" == '(true,)' ]]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout 5s gapplication action "$APP_ID" toggle
          visible=false
          for ((attempt=0; attempt<20; attempt++)); do
            kill -0 "$app_pid"
            if timeout 2s xdotool search --onlyvisible --class '^ch[.]lkmc[.]monkeyspaw$'; then
              visible=true; break
            fi
            sleep 1
          done
          test "$visible" = true
          sleep 5
          kill -0 "$app_pid"
          timeout 5s gapplication action "$APP_ID" quit
          wait "$app_pid"
          app_pid=
          SH
      - name: Upload the verified bundle and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-flatpak-artifacts
          path: |
            dist/${{ env.BUNDLE_FILE }}
            dist/${{ env.BUNDLE_FILE }}.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Restore user namespaces and remove sandbox files
        if: always()
        run: |
          set -euo pipefail
          # Cleanup must also work if setup failed before writing GITHUB_ENV.
          XDG_DATA_HOME="$RUNNER_TEMP/monkeyspaw-flatpak-data"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/monkeyspaw-flatpak-runtime"
          if [[ -f "$RUNNER_TEMP/monkeyspaw-flatpak-userns" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$RUNNER_TEMP/monkeyspaw-flatpak-userns")"
          fi
          rm -rf -- "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$HOME/.var/app/$APP_ID" \
            "$RUNNER_TEMP/monkeyspaw-tested-deb"
          rm -f -- "$RUNNER_TEMP/monkeyspaw-flatpak-userns" \
            "$RUNNER_TEMP/monkeyspaw-flatpak-launch.log"

  android:
    name: Android JVM tests, lint and APKs
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test, lint and assemble both APKs
        run: ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-android-reports
          path: |
            android/core/build/reports/tests/test/
            android/core/build/test-results/test/*.xml
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 3

  core-macos:
    name: Core on macOS
    needs: changes
    if: needs.changes.outputs.core-macos == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Test Core
        run: swift test

  macos-app:
    name: macOS app
    needs: changes
    if: needs.changes.outputs.macos-app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Build and test app
        run: |
          xcodebuild \
            -project MonkeysPaw.xcodeproj \
            -scheme MonkeysPaw \
            -destination 'platform=macOS' \
            -resultBundlePath MacAppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test
      - name: Upload app test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacAppTests
          path: MacAppTests.xcresult
          if-no-files-found: ignore

  macos-artifacts:
    name: Universal macOS artifacts
    needs: changes
    if: needs.changes.outputs.macos-artifacts == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: /bin/bash -e -o pipefail {0}
    env:
      ARTIFACT_VERSION: '0.1.0'
      ARTIFACT_BUILD_NUMBER: '42'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Install dmg tooling
        run: brew install create-dmg
      # This job intentionally has no signing secrets and runs no hosted tests.
      - name: Build and package universal app
        run: /bin/bash scripts/package-macos.sh "$ARTIFACT_VERSION" "$ARTIFACT_BUILD_NUMBER"
      - name: Verify and launch both packaged copies
        run: |
          set -euo pipefail

          check_directory=$(mktemp -d "$RUNNER_TEMP/monkeyspaw-artifacts.XXXXXX")
          mountpoint="$check_directory/mounted"
          extracted="$check_directory/extracted"
          image_attached=false
          app_pid=

          cleanup() {
            local status=$?
            if [[ -n "$app_pid" ]]; then
              kill -KILL "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            if [[ "$image_attached" == true ]]; then
              /usr/bin/hdiutil detach "$mountpoint" || \
                /usr/bin/hdiutil detach -force "$mountpoint" || status=1
            fi
            rm -rf "$check_directory"
            exit "$status"
          }
          trap cleanup EXIT

          verify_app() {
            local app=$1
            local architectures architecture
            architectures=$(/usr/bin/lipo -archs "$app/Contents/MacOS/MonkeysPaw")
            printf '%s: %s\n' "$app" "$architectures"
            for architecture in arm64 x86_64; do
              if [[ " $architectures " != *" $architecture "* ]]; then
                printf 'Missing architecture: %s\n' "$architecture" >&2
                return 1
              fi
            done
            /usr/bin/codesign --verify --deep --strict "$app"
            # Re-signing must keep Hardened Runtime and the paste entitlement.
            # Capture first: grep -q may close the pipe early under pipefail.
            local signature entitlements
            signature=$(/usr/bin/codesign --display --verbose=2 "$app" 2>&1)
            [[ "$signature" == *"flags="*"runtime"* ]]
            entitlements=$(/usr/bin/codesign --display --entitlements - "$app" 2>/dev/null)
            [[ "$entitlements" == *"com.apple.security.automation.apple-events"* ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$ARTIFACT_VERSION" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" == "$ARTIFACT_BUILD_NUMBER" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" == true ]]
          }

          smoke_launch() {
            local app=$1
            local attempt exit_status=0
            # Track the exact packaged executable's PID, without LaunchServices
            # reusing another installed copy or the build-directory app.
            "$app/Contents/MacOS/MonkeysPaw" >"$check_directory/launch.log" 2>&1 &
            app_pid=$!
            for (( attempt=0; attempt<5; attempt++ )); do
              sleep 1
              if ! kill -0 "$app_pid" 2>/dev/null; then
                printf 'Packaged app exited during launch: %s\n' "$app" >&2
                cat "$check_directory/launch.log" >&2 || true
                wait "$app_pid" 2>/dev/null || true
                app_pid=
                return 1
              fi
            done
            kill -TERM "$app_pid"
            for (( attempt=0; attempt<5; attempt++ )); do
              if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$app_pid" 2>/dev/null; then
              printf 'Packaged app did not terminate: %s\n' "$app" >&2
              return 1
            fi
            wait "$app_pid" || exit_status=$?
            app_pid=
            # SIGTERM is expected; a crash signal is a failed smoke launch.
            [[ "$exit_status" == 0 || "$exit_status" == 143 ]]
          }

          mkdir -p "$mountpoint" "$extracted"
          image_attached=true
          /usr/bin/hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" \
            "dist/MonkeysPaw-$ARTIFACT_VERSION.dmg"
          [[ -d "$mountpoint/MonkeysPaw.app" ]]
          [[ -L "$mountpoint/Applications" ]]
          [[ "$(readlink "$mountpoint/Applications")" == /Applications ]]
          /usr/bin/ditto -x -k "dist/MonkeysPaw-$ARTIFACT_VERSION.zip" "$extracted"
          [[ -d "$extracted/MonkeysPaw.app" ]]
          verify_app "$mountpoint/MonkeysPaw.app"
          verify_app "$extracted/MonkeysPaw.app"
          diff -rq "$mountpoint/MonkeysPaw.app" "$extracted/MonkeysPaw.app"

          # Suppress first-run Setup on this disposable runner; exercise the
          # resident LSUIElement app without requesting interactive permissions.
          /usr/bin/defaults write ch.lkmc.MonkeysPaw hasShownDeliverySetup -bool true
          smoke_launch "$mountpoint/MonkeysPaw.app"
          smoke_launch "$extracted/MonkeysPaw.app"
          /usr/bin/hdiutil detach "$mountpoint"
          image_attached=false
      - name: Upload dmg and zip for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-macos-artifacts
          path: |
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.dmg
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.zip
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.sha256
          if-no-files-found: error
          retention-days: 3

  server:
    name: Server build and tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build server
        run: swift build --package-path server
      - name: Test server
        run: swift test --package-path server
      - name: Check SyncAPI schema drift
        run: |
          set -eu
          schema_dir=$(mktemp -d)
          trap 'rm -rf "$schema_dir"' EXIT
          swift run --package-path server dump-schema "$schema_dir"
          diff -ru spec/schema "$schema_dir"

  server-image:
    name: Server image and health
    needs: changes
    if: needs.changes.outputs.server-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag monkeyspaw-server:ci -f server/Dockerfile .
      - name: Wait for container health and check the API
        run: |
          set -euo pipefail

          # An empty server fails closed without a bootstrap admin secret (§8.5).
          # Mount a throwaway one as a read-only file so it never appears in argv.
          bootstrap_dir=$(mktemp -d)
          head -c 32 /dev/urandom | base64 > "$bootstrap_dir/admin-password"
          chmod 0444 "$bootstrap_dir/admin-password"
          docker run --detach --name monkeyspaw-server-ci \
            --publish 127.0.0.1:8080:8080 \
            --volume "$bootstrap_dir/admin-password:/run/secrets/admin-password:ro" \
            --env MONKEYSPAW_ADMIN_PASSWORD_FILE=/run/secrets/admin-password \
            monkeyspaw-server:ci

          # Bound the wait to about one minute; print logs on failure.
          health_wait_attempts=30
          health_poll_seconds=2
          for _attempt in $(seq 1 "$health_wait_attempts"); do
            # A crashed entry point cannot become healthy; show its logs now.
            if [ "$(docker inspect --format '{{.State.Running}}' monkeyspaw-server-ci)" != true ]; then
              docker logs monkeyspaw-server-ci
              exit 1
            fi

            health=$(docker inspect --format '{{.State.Health.Status}}' monkeyspaw-server-ci)
            if [ "$health" = healthy ]; then
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/health
              exit 0
            fi

            if [ "$health" = unhealthy ]; then
              docker logs monkeyspaw-server-ci
              exit 1
            fi

            sleep "$health_poll_seconds"
          done

          docker logs monkeyspaw-server-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force monkeyspaw-server-ci || true

  compose-smoke:
    name: Compose smoke
    needs: changes
    if: needs.changes.outputs.compose-smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: monkeyspaw-compose-smoke
      # TLS is configuration-only here; never start Caddy or request certificates.
      COMPOSE_PROFILES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install smoke validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl python3 shellcheck
      - name: Check smoke script and fake-command tests
        run: |
          shellcheck scripts/compose-smoke.sh
          bash -n scripts/compose-smoke.sh
          python3 scripts/tests/test_compose_smoke.py
          # S19 supplies update.sh independently of this smoke slice.
          if [[ -f update.sh ]]; then
            shellcheck update.sh
            bash -n update.sh
          fi
      - name: Prepare private bootstrap and bind directories
        env:
          SMOKE_DIR: ${{ runner.temp }}/monkeyspaw-compose-smoke
        run: |
          set +x
          set -euo pipefail
          umask 077
          printf 'SMOKE_DIR=%s\n' "$SMOKE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_DIR"
          sudo install -d -m 0700 -o 1000 -g 1000 \
            "$SMOKE_DIR/config/monkeyspaw" \
            "$SMOKE_DIR/config/caddy/data" "$SMOKE_DIR/config/caddy/config"
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          work = Path(os.environ["SMOKE_DIR"])
          password = secrets.token_hex(32)
          password_file = work / "admin-password"
          password_file.write_text(password, encoding="utf-8")
          env_file = Path(".env")
          env_file.write_text(
              "PUID=1000\nPGID=1000\nCONFIG_DIR=" + str(work / "config") + "\n"
              "MONKEYSPAW_BIND_ADDRESS=127.0.0.1\nMONKEYSPAW_PORT=8790\n"
              "MONKEYSPAW_PUBLIC_URL=http://127.0.0.1:8790\nMONKEYSPAW_ADMIN_USERNAME=admin\n"
              "MONKEYSPAW_ADMIN_PASSWORD=" + password + "\n",
              encoding="utf-8",
          )
          password_file.chmod(0o600)
          env_file.chmod(0o600)
          PY
      - name: Validate default and TLS Compose configurations
        run: |
          docker compose config --quiet
          MONKEYSPAW_PUBLIC_URL=https://compose-smoke.invalid docker compose --profile tls config --quiet
      - name: Start Compose and check health, login, push and pull
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          TMPDIR="$SMOKE_DIR" scripts/compose-smoke.sh http://127.0.0.1:8790 "$SMOKE_DIR/admin-password"
      - name: Show server logs on failure
        if: failure()
        run: |
          timeout 30 docker compose ps --all || true
          timeout 30 docker compose logs --no-color --tail 200 monkeyspaw-server
      - name: Remove Compose deployment and private files
        if: always()
        env:
          SMOKE_DIR: ${{ runner.temp }}/monkeyspaw-compose-smoke
        run: |
          set -euo pipefail
          trap 'rm -f .env; sudo rm -rf -- "$SMOKE_DIR"' EXIT
          if [[ -f compose.yaml && -f .env ]]; then
            timeout 60 docker compose --profile tls down -v --remove-orphans --timeout 10
          fi
