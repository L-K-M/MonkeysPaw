name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Least privilege: builds and tests only need to read repository contents.
permissions:
  contents: read

# Separate ordinary CI from release calls; cancel superseded PR runs only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a timeout so a wedged build cannot consume the default six hours.
jobs:
  core-linux:
    name: Core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    # This is the portability gate: Core must build without Apple or GTK APIs.
    steps:
      # Immutable action SHAs prevent a mutable tag from changing executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure project validation tools
        run: |
          command -v python3 || {
            apt-get update
            apt-get install -y --no-install-recommends python3
          }
      - name: Validate Xcode object references
        run: python3 scripts/check-pbxproj.py
      - name: Check committed versions and Debian version mapping
        run: python3 scripts/check-version.py
      - name: Test packaging scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build Core
        run: swift build --target MonkeysPawCore
      # swift test builds every test target, even with --filter. Compile Core
      # tests without GTK here; run them in linux-app below.
      - name: Build Core tests without GTK
        run: swift build --target MonkeysPawCoreTests

  linux-app:
    name: Linux GTK app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and display test tools
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev xvfb xauth desktop-file-utils dbus \
            libglib2.0-bin xdotool xterm openbox x11-utils python3
      - name: Build Linux app
        run: swift build --product monkeyspaw
      - name: Test Core on Linux
        run: swift test --filter MonkeysPawCoreTests
      - name: Test Linux app with a required display and portal bus
        env:
          MONKEYSPAW_REQUIRE_DISPLAY: '1'
          # Enable fake portal ownership only on this private D-Bus session.
          MONKEYSPAW_REQUIRE_PORTAL_BUS: '1'
          # Keep settings in memory instead of using the host's dconf storage.
          GSETTINGS_BACKEND: memory
          # Disable accessibility bus discovery in this isolated test session.
          GTK_A11Y: none
          # Use software rendering so Xvfb needs no GL or GPU support.
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: dbus-run-session -- xvfb-run -a swift test --filter MonkeysPawLinuxTests
      - name: Test filesystem permissions as an unprivileged user
        shell: bash
        env:
          MONKEYSPAW_REQUIRE_DISPLAY: '1'
          MONKEYSPAW_REQUIRE_PORTAL_BUS: '1'
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: |
          set -euo pipefail
          # This job runs as root inside the swift:6.4-noble container.
          useradd --create-home --shell /bin/bash monkeyspaw-tests
          test "$(id -u monkeyspaw-tests)" -ne 0
          chown -R monkeyspaw-tests:monkeyspaw-tests .build
          # Every test that skips as root. Each must report passed; XCTest may
          # print one summary per test target, so counts are not compared.
          tests=(
            RootedFileStoreTests/testInitializationErrorsDoNotExposeOSPaths
            RootedFileWatcherTests/testRescanFailuresLogOncePerStreakAndKeepBaselineAndMonitoring
            RootedFileWatcherHealthTests/testUnreadableRootReportsUnavailableOnce
            ValuesStoreFileTests/testGlobalResetRecoversUnreadableRegularFileWithoutReadingIt
            LinuxForgetControlsTests/testUnreadableValuesShowTypedFailuresAndRecover
            LinuxLibrarySwitchTests/testUnreadableTargetIsRejectedWithoutStoppingTheOldWatcher
            LinuxLibrarySwitchTests/testSettingsWriteFailureKeepsNewGraphForTheSessionAndReportsTheError
            LinuxSecretStoreTests/testFailedFileCleanupRestoresThePreviousServiceValue
            LinuxSecretStoreTests/testFailedFileCleanupClearsANewServiceItemWhenThePreviousTierWasFile
            LinuxOnboardingTests/testUnreadableChosenFolderOpensRecoveryAndCanUseTheDefault
            LinuxOnboardingTests/testSeedWriteFailureShowsTypedCopyAndDoesNotRepeatAfterRestart
            LinuxOnboardingTests/testFailedSeedOfferRecordingCopiesNothingAndLeavesTheOfferPending
            LinuxOnboardingTests/testTourWriteFailureKeepsDoneAndClosePendingUntilRetry
            FileLogSinkTests/testUnwritableDirectoryReportsOnceAndOtherSinksKeepReceivingRecords
            FileLogSinkTests/testUnwritableFilePreservesExistingBytesAndReportsOnce
          )
          filter=$(IFS='|'; echo "${tests[*]}")
          # SwiftPM keeps its workspace lock in TMPDIR; root's lock in /tmp is
          # unusable. The GTK cases need the private bus and display.
          runuser -u monkeyspaw-tests -- env TMPDIR=/home/monkeyspaw-tests \
            dbus-run-session -- xvfb-run -a swift test --skip-build --filter "$filter" \
            2>&1 | tee permission-tests.log
          for test in "${tests[@]}"; do
            grep -qF "Test Case '${test/\//.}' passed" permission-tests.log
          done
          ! grep -E "Test Case '.*' (skipped|failed)" permission-tests.log
      - name: Smoke X11 delivery and CLI self-test
        env:
          GSETTINGS_BACKEND: memory
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          XDG_SESSION_TYPE: x11
          XDG_CURRENT_DESKTOP: MONKEYSPAW_CI
        run: |
          timeout 60s dbus-run-session -- xvfb-run -a \
            bash scripts/linux-delivery-smoke.sh .build/debug/monkeyspaw
      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/ch.lkmc.monkeyspaw.desktop

  deb:
    name: Ubuntu 24.04 Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Debian package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config python3 dpkg-dev binutils desktop-file-utils shellcheck
      - name: Check packaging scripts
        run: |
          shellcheck packaging/build-deb.sh scripts/make-linux-icons.sh
          python3 scripts/check-version.py
      - name: Test server updater
        run: |
          shellcheck update.sh scripts/tests/test-update.sh
          shellcheck --shell=sh update.sh scripts/tests/test-update.sh
          bash scripts/tests/test-update.sh
          UPDATE_TEST_SHELL=dash dash scripts/tests/test-update.sh
      - name: Test server backup wrapper
        run: |
          shellcheck scripts/backup.sh scripts/tests/test-backup.sh
          bash scripts/tests/test-backup.sh
      - name: Build a prerelease package
        # A fixed version exercises the tilde mapping without bumping the repo.
        run: packaging/build-deb.sh v0.1.0-beta.1
      - name: Inspect package metadata and payload
        run: |
          set -euo pipefail
          deb="dist/monkeyspaw_0.1.0~beta.1_$(dpkg --print-architecture).deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = monkeyspaw
          test "$(dpkg-deb --field "$deb" Version)" = '0.1.0~beta.1'
          test "$(dpkg-deb --field "$deb" Architecture)" = "$(dpkg --print-architecture)"
          test "$(dpkg-deb --field "$deb" Section)" = utils
          test "$(dpkg-deb --field "$deb" Priority)" = optional
          test "$(dpkg-deb --field "$deb" Maintainer)" = 'L-K-M <noreply@lkmc.ch>'
          test "$(dpkg-deb --field "$deb" Recommends)" = 'libsecret-tools, ydotool, xdotool'
          test "$(dpkg-deb --field "$deb" Installed-Size)" -gt 0
          test -n "$(dpkg-deb --field "$deb" Description)"
          depends="$(dpkg-deb --field "$deb" Depends)"
          for dependency in libgtk-4-1 libglib2.0-0t64 libglib2.0-bin; do
            grep -Eq "(^|, )${dependency}( |,|$)" <<< "$depends"
          done

          dpkg-deb --contents "$deb"
          payload="$RUNNER_TEMP/monkeyspaw-deb"
          dpkg-deb --extract "$deb" "$payload"
          test -x "$payload/usr/bin/monkeyspaw"
          cmp packaging/linux/ch.lkmc.monkeyspaw.desktop \
            "$payload/usr/share/applications/ch.lkmc.monkeyspaw.desktop"
          cmp packaging/linux/ch.lkmc.monkeyspaw.service \
            "$payload/usr/share/dbus-1/services/ch.lkmc.monkeyspaw.service"
          cmp packaging/debian/copyright "$payload/usr/share/doc/monkeyspaw/copyright"
          test -s "$payload/usr/share/doc/monkeyspaw/changelog.gz"
          for size in 16 24 32 48 64 128 256 512; do
            icon="icons/hicolor/${size}x${size}/apps/ch.lkmc.monkeyspaw.png"
            cmp "packaging/$icon" "$payload/usr/share/$icon"
          done

          readelf -d "$payload/usr/bin/monkeyspaw"
          dynamic="$(ldd "$payload/usr/bin/monkeyspaw")"
          printf '%s\n' "$dynamic"
          if grep -Eq 'lib(swift|Foundation|CoreFoundation|dispatch|BlocksRuntime|_)|not found' <<< "$dynamic"; then
            echo 'Swift/Foundation must be static and system libraries must resolve' >&2
            exit 1
          fi
      - name: Install and check the packaged version
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./dist/*.deb
          command -v gapplication
          version="$(/usr/bin/monkeyspaw --version)"
          printf '%s\n' "$version"
          test "$version" = 'monkeyspaw 0.1.0-beta.1'

  android:
    name: Android JVM tests, lint and APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test, lint and assemble both APKs
        run: ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MonkeysPaw-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  core-macos:
    name: Core on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Test Core
        run: swift test

  macos-app:
    name: macOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Build and test app
        run: |
          xcodebuild \
            -project MonkeysPaw.xcodeproj \
            -scheme MonkeysPaw \
            -destination 'platform=macOS' \
            -resultBundlePath MacAppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test
      - name: Upload app test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacAppTests
          path: MacAppTests.xcresult
          if-no-files-found: ignore

  macos-artifacts:
    name: Universal macOS artifacts
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: /bin/bash -e -o pipefail {0}
    env:
      ARTIFACT_VERSION: '0.1.0'
      ARTIFACT_BUILD_NUMBER: '42'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Install dmg tooling
        run: brew install create-dmg
      # This job intentionally has no signing secrets and runs no hosted tests.
      - name: Build and package universal app
        run: /bin/bash scripts/package-macos.sh "$ARTIFACT_VERSION" "$ARTIFACT_BUILD_NUMBER"
      - name: Verify and launch both packaged copies
        run: |
          set -euo pipefail

          check_directory=$(mktemp -d "$RUNNER_TEMP/monkeyspaw-artifacts.XXXXXX")
          mountpoint="$check_directory/mounted"
          extracted="$check_directory/extracted"
          image_attached=false
          app_pid=

          cleanup() {
            local status=$?
            if [[ -n "$app_pid" ]]; then
              kill -KILL "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            if [[ "$image_attached" == true ]]; then
              /usr/bin/hdiutil detach "$mountpoint" || \
                /usr/bin/hdiutil detach -force "$mountpoint" || status=1
            fi
            rm -rf "$check_directory"
            exit "$status"
          }
          trap cleanup EXIT

          verify_app() {
            local app=$1
            local architectures architecture
            architectures=$(/usr/bin/lipo -archs "$app/Contents/MacOS/MonkeysPaw")
            printf '%s: %s\n' "$app" "$architectures"
            for architecture in arm64 x86_64; do
              if [[ " $architectures " != *" $architecture "* ]]; then
                printf 'Missing architecture: %s\n' "$architecture" >&2
                return 1
              fi
            done
            /usr/bin/codesign --verify --deep --strict "$app"
            # Re-signing must keep Hardened Runtime and the paste entitlement.
            # Capture first: grep -q may close the pipe early under pipefail.
            local signature entitlements
            signature=$(/usr/bin/codesign --display --verbose=2 "$app" 2>&1)
            [[ "$signature" == *"flags="*"runtime"* ]]
            entitlements=$(/usr/bin/codesign --display --entitlements - "$app" 2>/dev/null)
            [[ "$entitlements" == *"com.apple.security.automation.apple-events"* ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$ARTIFACT_VERSION" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" == "$ARTIFACT_BUILD_NUMBER" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" == true ]]
          }

          smoke_launch() {
            local app=$1
            local attempt exit_status=0
            # Track the exact packaged executable's PID, without LaunchServices
            # reusing another installed copy or the build-directory app.
            "$app/Contents/MacOS/MonkeysPaw" >"$check_directory/launch.log" 2>&1 &
            app_pid=$!
            for (( attempt=0; attempt<5; attempt++ )); do
              sleep 1
              if ! kill -0 "$app_pid" 2>/dev/null; then
                printf 'Packaged app exited during launch: %s\n' "$app" >&2
                cat "$check_directory/launch.log" >&2 || true
                wait "$app_pid" 2>/dev/null || true
                app_pid=
                return 1
              fi
            done
            kill -TERM "$app_pid"
            for (( attempt=0; attempt<5; attempt++ )); do
              if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$app_pid" 2>/dev/null; then
              printf 'Packaged app did not terminate: %s\n' "$app" >&2
              return 1
            fi
            wait "$app_pid" || exit_status=$?
            app_pid=
            # SIGTERM is expected; a crash signal is a failed smoke launch.
            [[ "$exit_status" == 0 || "$exit_status" == 143 ]]
          }

          mkdir -p "$mountpoint" "$extracted"
          image_attached=true
          /usr/bin/hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" \
            "dist/MonkeysPaw-$ARTIFACT_VERSION.dmg"
          [[ -d "$mountpoint/MonkeysPaw.app" ]]
          [[ -L "$mountpoint/Applications" ]]
          [[ "$(readlink "$mountpoint/Applications")" == /Applications ]]
          /usr/bin/ditto -x -k "dist/MonkeysPaw-$ARTIFACT_VERSION.zip" "$extracted"
          [[ -d "$extracted/MonkeysPaw.app" ]]
          verify_app "$mountpoint/MonkeysPaw.app"
          verify_app "$extracted/MonkeysPaw.app"
          diff -rq "$mountpoint/MonkeysPaw.app" "$extracted/MonkeysPaw.app"

          # Suppress first-run Setup on this disposable runner; exercise the
          # resident LSUIElement app without requesting interactive permissions.
          /usr/bin/defaults write ch.lkmc.MonkeysPaw hasShownDeliverySetup -bool true
          smoke_launch "$mountpoint/MonkeysPaw.app"
          smoke_launch "$extracted/MonkeysPaw.app"
          /usr/bin/hdiutil detach "$mountpoint"
          image_attached=false
      - name: Upload dmg and zip for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MonkeysPaw-macos-artifacts
          path: |
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.dmg
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.zip
            dist/MonkeysPaw-${{ env.ARTIFACT_VERSION }}.sha256
          if-no-files-found: error
          retention-days: 3

  server:
    name: Server build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build server
        run: swift build --package-path server
      - name: Test server
        run: swift test --package-path server
      - name: Check SyncAPI schema drift
        run: |
          set -eu
          schema_dir=$(mktemp -d)
          trap 'rm -rf "$schema_dir"' EXIT
          swift run --package-path server dump-schema "$schema_dir"
          diff -ru spec/schema "$schema_dir"

  server-image:
    name: Server image and health
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag monkeyspaw-server:ci -f server/Dockerfile .
      - name: Wait for container health and check the API
        run: |
          set -euo pipefail

          # An empty server fails closed without a bootstrap admin secret (§8.5).
          # Mount a throwaway one as a read-only file so it never appears in argv.
          bootstrap_dir=$(mktemp -d)
          head -c 32 /dev/urandom | base64 > "$bootstrap_dir/admin-password"
          chmod 0444 "$bootstrap_dir/admin-password"
          docker run --detach --name monkeyspaw-server-ci \
            --publish 127.0.0.1:8080:8080 \
            --volume "$bootstrap_dir/admin-password:/run/secrets/admin-password:ro" \
            --env MONKEYSPAW_ADMIN_PASSWORD_FILE=/run/secrets/admin-password \
            monkeyspaw-server:ci

          # Bound the wait to about one minute; print logs on failure.
          health_wait_attempts=30
          health_poll_seconds=2
          for _attempt in $(seq 1 "$health_wait_attempts"); do
            # A crashed entry point cannot become healthy; show its logs now.
            if [ "$(docker inspect --format '{{.State.Running}}' monkeyspaw-server-ci)" != true ]; then
              docker logs monkeyspaw-server-ci
              exit 1
            fi

            health=$(docker inspect --format '{{.State.Health.Status}}' monkeyspaw-server-ci)
            if [ "$health" = healthy ]; then
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/health
              exit 0
            fi

            if [ "$health" = unhealthy ]; then
              docker logs monkeyspaw-server-ci
              exit 1
            fi

            sleep "$health_poll_seconds"
          done

          docker logs monkeyspaw-server-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force monkeyspaw-server-ci || true
