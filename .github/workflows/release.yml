name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify artifacts and images without publishing
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - server/Dockerfile
      - packaging/**
      - flatpak/**
      - scripts/build-flatpak.sh
      - scripts/flatpak-smoke.py
      - scripts/package-macos.sh
      - scripts/package-android.sh
      - scripts/verify-android-release.py
      # Third-party notices generators, checks and texts.
      - scripts/swiftpm-notices.py
      - scripts/bundle-notices.sh
      - scripts/third-party-notices.json
      - scripts/deb-copyright.py
      - scripts/static-runtime-notices.py
      - scripts/android_notices.py
      - scripts/oci-licenses.py
      - scripts/check-image-notices.sh
      - scripts/licenses/**
      - server/licenses/**
      - docs/licenses/UNICODE.txt
      - LICENSE
      - scripts/build.sh
      - scripts/check-version.py
      - scripts/sync-android-version.sh
      - scripts/release.sh
      - scripts/tests/**
      - android/**
      - spec/**
      - seed/**
      - MonkeysPaw.xcodeproj/project.pbxproj
      - README.md

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Write permissions belong only to the GitHub publish job.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Test the release commit
    permissions:
      contents: read
    # The local workflow is resolved from this exact commit. Its runner jobs
    # already have timeouts; GitHub does not allow a timeout on a workflow call.
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release version
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      revision: ${{ steps.version.outputs.revision }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against committed settings
        id: version
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          python3 scripts/check-version.py
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check-version.py --check-tag "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            if [[ "$PUBLISH_REQUESTED" == true ]]; then
              echo '::error::Publishing requires an existing v* tag; select a tag or enable dry_run'
              exit 1
            fi
            # PRs and branch dry runs package the committed development version.
            version=$(python3 scripts/check-version.py --committed-version)
            [[ -n "$version" ]] || { echo '::error::Missing committed version'; exit 1; }
            tag="v$version"
          fi
          prerelease=false
          if [[ "$tag" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$PUBLISH_REQUESTED"
            echo "prerelease=$prerelease"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Build release deb
    needs: [tests, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container: swift:6.4-noble
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    outputs:
      deb_file: ${{ steps.package.outputs.deb_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Debian package build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config python3 dpkg-dev binutils desktop-file-utils shellcheck
      - name: Check build scripts
        run: |
          shellcheck scripts/build.sh packaging/build-deb.sh
          for script in scripts/build.sh packaging/build-deb.sh; do bash -n "$script"; done
          scripts/build.sh --help
      - name: Package the tag version
        id: package
        run: |
          # RELEASE_TAG is GITHUB_REF_NAME for tags, or v<committed version>
          # for PR/branch dry runs; the builder accepts either form.
          packaging/build-deb.sh "$RELEASE_TAG"
          deb_version=$(python3 scripts/check-version.py --deb-version "$RELEASE_TAG")
          deb_file="monkeyspaw_${deb_version}_$(dpkg --print-architecture).deb"
          test -s "dist/$deb_file"
          (cd dist && sha256sum -c "$deb_file.sha256")
          test "$(dpkg-deb --field "dist/$deb_file" Package)" = monkeyspaw
          test "$(dpkg-deb --field "dist/$deb_file" Architecture)" = amd64
          test "$(dpkg-deb --field "dist/$deb_file" Version)" = "$deb_version"
          apt-get install -y --no-install-recommends "./dist/$deb_file"
          test "$(/usr/bin/monkeyspaw --version)" = "monkeyspaw ${RELEASE_TAG#v}"
          # Check the deb itself: minimized images may skip /usr/share/doc on install.
          payload="$RUNNER_TEMP/release-deb-payload"
          dpkg-deb --extract "dist/$deb_file" "$payload"
          test -s "$payload/usr/share/doc/monkeyspaw/copyright"
          test -s "$payload/usr/share/doc/monkeyspaw/Third-Party-Notices.txt"
          grep -q 'Kirill Simonov' "$payload/usr/share/doc/monkeyspaw/copyright"
          grep -q 'Unicode, Inc. and others' "$payload/usr/share/doc/monkeyspaw/Third-Party-Notices.txt"
          echo "deb_file=$deb_file" >> "$GITHUB_OUTPUT"
      - name: Upload deb and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-release-deb
          path: |
            dist/${{ steps.package.outputs.deb_file }}
            dist/${{ steps.package.outputs.deb_file }}.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Download the uploaded deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-release-deb
          path: ${{ runner.temp }}/deb-roundtrip
      - name: Byte-compare against original deb outputs
        env:
          DEB_FILE: ${{ steps.package.outputs.deb_file }}
        run: |
          for file in "$DEB_FILE" "$DEB_FILE.sha256"; do
            cmp "dist/$file" "$RUNNER_TEMP/deb-roundtrip/$file"
          done
          (cd "$RUNNER_TEMP/deb-roundtrip" && sha256sum -c "$DEB_FILE.sha256")

  flatpak:
    name: Repack the release deb as a GNOME 50 Flatpak
    needs: [tests, verify, linux]
    # bwrap needs the bare runner's unprivileged user namespaces.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ID: ch.lkmc.monkeyspaw
      VERSION: ${{ needs.verify.outputs.version }}
      DEB_FILE: ${{ needs.linux.outputs.deb_file }}
    outputs:
      bundle_file: ${{ steps.package.outputs.bundle_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the exact release deb and checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-release-deb
          path: ${{ runner.temp }}/monkeyspaw-tested-deb
      - name: Prepare bounded user namespaces and GNOME 50
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/monkeyspaw-flatpak-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/monkeyspaw-flatpak-runtime"
          printf 'XDG_DATA_HOME=%s\nXDG_RUNTIME_DIR=%s\n' "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder bubblewrap dbus
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              > "$RUNNER_TEMP/monkeyspaw-flatpak-userns"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          timeout 10s bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /usr/bin/true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          timeout --kill-after=10s 15m dbus-run-session -- \
            flatpak install --user --noninteractive --assumeyes --arch=x86_64 flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Repack and verify the exact release bundle
        id: package
        run: |
          (cd "$RUNNER_TEMP/monkeyspaw-tested-deb" && sha256sum --strict -c "$DEB_FILE.sha256")
          timeout --kill-after=10s 5m dbus-run-session -- scripts/build-flatpak.sh \
            "$RUNNER_TEMP/monkeyspaw-tested-deb/$DEB_FILE" "$VERSION"
          bundle_file="monkeyspaw_${VERSION}_x86_64.flatpak"
          (cd dist && sha256sum --strict -c "$bundle_file.sha256")
          timeout --kill-after=10s 2m dbus-run-session -- \
            flatpak install --user --noninteractive --assumeyes "dist/$bundle_file"
          payload=$(mktemp -d "$RUNNER_TEMP/monkeyspaw-flatpak-payload.XXXXXX")
          trap 'rm -rf -- "$payload"' EXIT
          dpkg-deb --extract "$RUNNER_TEMP/monkeyspaw-tested-deb/$DEB_FILE" "$payload"
          deployment=$(flatpak info --user --show-location "$APP_ID")
          test "$(flatpak info --user --show-runtime "$APP_ID")" = org.gnome.Platform/x86_64/50
          cmp "$payload/usr/bin/monkeyspaw" "$deployment/files/bin/monkeyspaw"
          # The bundle keeps the deb's third-party notices verbatim.
          for notice in copyright Third-Party-Notices.txt; do
            test -s "$deployment/files/share/doc/monkeyspaw/$notice"
            cmp "$payload/usr/share/doc/monkeyspaw/$notice" "$deployment/files/share/doc/monkeyspaw/$notice"
          done
          test "$(timeout 15s dbus-run-session -- flatpak run --user "$APP_ID" --version)" = "monkeyspaw $VERSION"
          echo "bundle_file=$bundle_file" >> "$GITHUB_OUTPUT"
      - name: Upload the verified bundle and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-release-flatpak
          path: |
            dist/${{ steps.package.outputs.bundle_file }}
            dist/${{ steps.package.outputs.bundle_file }}.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Download the uploaded Flatpak artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-release-flatpak
          path: ${{ runner.temp }}/flatpak-roundtrip
      - name: Byte-compare against original Flatpak outputs
        env:
          BUNDLE_FILE: ${{ steps.package.outputs.bundle_file }}
        run: |
          for file in "$BUNDLE_FILE" "$BUNDLE_FILE.sha256"; do
            cmp "dist/$file" "$RUNNER_TEMP/flatpak-roundtrip/$file"
          done
          (cd "$RUNNER_TEMP/flatpak-roundtrip" && sha256sum --strict -c "$BUNDLE_FILE.sha256")
      - name: Restore user namespaces and remove sandbox files
        if: always()
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/monkeyspaw-flatpak-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/monkeyspaw-flatpak-runtime"
          timeout 10s flatpak kill "$APP_ID" >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/monkeyspaw-flatpak-userns" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$RUNNER_TEMP/monkeyspaw-flatpak-userns")"
          fi
          rm -rf -- "$RUNNER_TEMP/monkeyspaw-flatpak-data" "$RUNNER_TEMP/monkeyspaw-flatpak-runtime" \
            "$RUNNER_TEMP/monkeyspaw-tested-deb" "$RUNNER_TEMP/flatpak-roundtrip" "$HOME/.var/app/$APP_ID"
          rm -f -- "$RUNNER_TEMP/monkeyspaw-flatpak-userns"

  macos:
    name: Build release macOS artifacts
    needs: [tests, verify, linux]
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: /bin/bash -e -o pipefail {0}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'
      - name: Install dmg and lint tooling
        run: brew install create-dmg shellcheck
      - name: Check build scripts with system Bash
        run: |
          shellcheck scripts/build.sh scripts/package-macos.sh
          for script in scripts/build.sh scripts/package-macos.sh; do /bin/bash -n "$script"; done
      - name: Package the tag version
        env:
          SIGNING_IDENTITY_SECRET: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          SIGNING_KEYCHAIN_SECRET: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGNING_KEYCHAIN || '' }}
        run: |
          # Empty secrets must leave signing env unset, selecting ad-hoc signing.
          # PR builds never receive signing secrets, including same-repo PRs.
          if [[ -n "$SIGNING_IDENTITY_SECRET" ]]; then
            export MACOS_SIGNING_IDENTITY="$SIGNING_IDENTITY_SECRET"
            if [[ -n "$SIGNING_KEYCHAIN_SECRET" ]]; then
              export MACOS_SIGNING_KEYCHAIN="$SIGNING_KEYCHAIN_SECRET"
            fi
          fi
          /bin/bash scripts/package-macos.sh "$VERSION" "$GITHUB_RUN_NUMBER"
          (cd dist && shasum -a 256 -c "MonkeysPaw-$VERSION.sha256")
          # The published zip must carry the bundled third-party notices.
          notices=$(unzip -p "dist/MonkeysPaw-$VERSION.zip" MonkeysPaw.app/Contents/Resources/Third-Party-Notices.txt)
          grep -q '^Yams ' <<< "$notices"
          grep -q 'Kirill Simonov' <<< "$notices"
      - name: Upload dmg, zip and checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-release-macos
          path: |
            dist/MonkeysPaw-${{ env.VERSION }}.dmg
            dist/MonkeysPaw-${{ env.VERSION }}.zip
            dist/MonkeysPaw-${{ env.VERSION }}.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Download the uploaded macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-release-macos
          path: ${{ runner.temp }}/macos-roundtrip
      - name: Byte-compare against original macOS outputs
        run: |
          for extension in dmg zip sha256; do
            file="MonkeysPaw-$VERSION.$extension"
            cmp "dist/$file" "$RUNNER_TEMP/macos-roundtrip/$file"
          done
          (cd "$RUNNER_TEMP/macos-roundtrip" && shasum -a 256 -c "MonkeysPaw-$VERSION.sha256")

  android-build:
    name: Build and verify release APK
    needs: [tests, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      apk_file: ${{ steps.package.outputs.apk_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test, lint and shrink the full release version
        run: ./gradlew --max-workers=2 :core:test testDebugUnitTest lintDebug assembleRelease "-PreleaseVersion=$VERSION" -Pandroid.builder.sdkDownload=false
      - name: Stage and verify APK metadata, signer and checksum
        id: package
        run: |
          ../scripts/package-android.sh "$VERSION"
          apk_file="monkeyspaw-v$VERSION.apk"
          python3 ../scripts/verify-android-release.py "../dist/$apk_file" "$VERSION"
          echo "apk_file=$apk_file" >> "$GITHUB_OUTPUT"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-release-android
          path: |
            dist/${{ steps.package.outputs.apk_file }}
            dist/${{ steps.package.outputs.apk_file }}.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Download the uploaded APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MonkeysPaw-release-android
          path: ${{ runner.temp }}/android-roundtrip
      - name: Byte-compare against original APK outputs
        env:
          APK_FILE: ${{ steps.package.outputs.apk_file }}
        run: |
          for file in "$APK_FILE" "$APK_FILE.sha256"; do
            cmp "../dist/$file" "$RUNNER_TEMP/android-roundtrip/$file"
          done
          (cd "$RUNNER_TEMP/android-roundtrip" && sha256sum --strict -c "$APK_FILE.sha256")
      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MonkeysPaw-android-release-reports
          path: |
            android/core/build/reports/tests/test/
            android/core/build/test-results/test/*.xml
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 3

  artifacts:
    name: Verify all release assets
    needs: [tests, verify, linux, flatpak, macos, android-build, server-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DEB_FILE: ${{ needs.linux.outputs.deb_file }}
      BUNDLE_FILE: ${{ needs.flatpak.outputs.bundle_file }}
      APK_FILE: ${{ needs.android-build.outputs.apk_file }}
    steps:
      - name: Assemble verified workflow artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MonkeysPaw-release-*
          merge-multiple: true
          path: dist
      - name: Require every asset and verify checksums
        run: |
          for file in "$DEB_FILE" "$DEB_FILE.sha256" \
            "$BUNDLE_FILE" "$BUNDLE_FILE.sha256" \
            "MonkeysPaw-$VERSION.dmg" "MonkeysPaw-$VERSION.zip" "MonkeysPaw-$VERSION.sha256" \
            "$APK_FILE" "$APK_FILE.sha256"; do
            test -f "dist/$file" && test -s "dist/$file"
          done
          shopt -s nullglob dotglob
          files=(dist/*)
          test "${#files[@]}" -eq 9 # Seven desktop assets plus APK/checksum.
          # Require each manifest to cover its exact payloads, once, in package order.
          verify_manifest() {
            local manifest="$1" digest filename
            shift
            local names=()
            while read -r digest filename || [[ -n "$digest" || -n "$filename" ]]; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              names+=("$filename")
            done < "dist/$manifest"
            test "${names[*]}" = "$*"
          }
          verify_manifest "$DEB_FILE.sha256" "$DEB_FILE"
          verify_manifest "$BUNDLE_FILE.sha256" "$BUNDLE_FILE"
          verify_manifest "MonkeysPaw-$VERSION.sha256" "MonkeysPaw-$VERSION.zip" "MonkeysPaw-$VERSION.dmg"
          verify_manifest "$APK_FILE.sha256" "$APK_FILE"
          (cd dist && sha256sum --strict -c "$DEB_FILE.sha256" "$BUNDLE_FILE.sha256" "MonkeysPaw-$VERSION.sha256" "$APK_FILE.sha256")

  server-images:
    name: Build and smoke server image (${{ matrix.arch }})
    needs: [tests, verify, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.verify.outputs.version }}
      REVISION: ${{ needs.verify.outputs.revision }}
      CREATED: ${{ needs.verify.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OCI archive tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Build native OCI archive and load it for smoke testing
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo '::error::Image build requires a native runner'; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/server-image"
          archive="$RUNNER_TEMP/server-image/server-$ARCH.tar"
          # The container driver supports OCI export without changing the daemon.
          docker buildx create --name monkeyspaw-server-release --driver docker-container --use
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" \
            --build-arg "CREATED=$CREATED" --output "type=oci,dest=$archive" \
            -f server/Dockerfile .
          skopeo inspect --raw "oci-archive:$archive" > "$RUNNER_TEMP/server-manifest.json"
          skopeo inspect --config "oci-archive:$archive" > "$RUNNER_TEMP/server-config.json"
          # The licenses label must stay as the Dockerfile states it.
          IMAGE_LICENSES=$(python3 scripts/oci-licenses.py dockerfile server/Dockerfile)
          export IMAGE_LICENSES
          python3 - "$RUNNER_TEMP/server-manifest.json" "$RUNNER_TEMP/server-config.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1]) as file:
              manifest = json.load(file)
          with open(sys.argv[2]) as file:
              config = json.load(file)
          assert manifest["mediaType"] == "application/vnd.oci.image.manifest.v1+json"
          assert config["os"] == "linux" and config["architecture"] == os.environ["ARCH"]
          labels = config["config"]["Labels"]
          expected = {
              "source": "https://github.com/L-K-M/MonkeysPaw",
              "version": os.environ["VERSION"],
              "revision": os.environ["REVISION"],
              "created": os.environ["CREATED"],
              "licenses": os.environ["IMAGE_LICENSES"],
          }
          for key, value in expected.items():
              assert labels["org.opencontainers.image." + key] == value, key
          PY
          skopeo manifest-digest "$RUNNER_TEMP/server-manifest.json" \
            > "$RUNNER_TEMP/server-image/server-$ARCH.digest"
          skopeo copy "oci-archive:$archive" docker-daemon:monkeyspaw-server:release
          # Notices for the statically linked code ship in the image, and the
          # label names every term they and the installed packages carry.
          # Installed packages (server/Dockerfile): tini MIT; ca-certificates
          # GPL-2.0-or-later scripts and MPL-2.0 CA data; libcurl4t64 curl.
          sh scripts/check-image-notices.sh monkeyspaw-server:release /usr/share/doc/monkeyspaw-server \
            Third-Party-Notices.txt LICENSE \
            -- --own Unlicense --add MIT --add GPL-2.0-or-later --add MPL-2.0 --add curl
      - name: Wait for container health and require API status 200
        run: |
          set -euo pipefail
          bootstrap_dir=$(mktemp -d)
          trap 'docker rm --force monkeyspaw-server-release >/dev/null 2>&1 || true; rm -rf "$bootstrap_dir"' EXIT
          head -c 32 /dev/urandom | base64 > "$bootstrap_dir/admin-password"
          chmod 0444 "$bootstrap_dir/admin-password"
          docker run --detach --name monkeyspaw-server-release \
            --publish 127.0.0.1:8080:8080 \
            --volume "$bootstrap_dir/admin-password:/run/secrets/admin-password:ro" \
            --env MONKEYSPAW_ADMIN_PASSWORD_FILE=/run/secrets/admin-password \
            monkeyspaw-server:release

          health_wait_attempts=30
          health_poll_seconds=2
          for _attempt in $(seq 1 "$health_wait_attempts"); do
            if [[ "$(docker inspect --format '{{.State.Running}}' monkeyspaw-server-release)" != true ]]; then
              docker logs monkeyspaw-server-release
              exit 1
            fi
            health=$(docker inspect --format '{{.State.Health.Status}}' monkeyspaw-server-release)
            if [[ "$health" == healthy ]]; then
              status=$(curl --silent --show-error --max-time 5 --output /dev/null \
                --write-out '%{http_code}' http://127.0.0.1:8080/api/health || true)
              if [[ "$status" != 200 ]]; then
                echo "::error::/api/health returned ${status:-no response}"
                docker logs monkeyspaw-server-release
                exit 1
              fi
              exit 0
            fi
            if [[ "$health" == unhealthy ]]; then
              docker logs monkeyspaw-server-release
              exit 1
            fi
            sleep "$health_poll_seconds"
          done

          docker logs monkeyspaw-server-release
          exit 1
      - name: Upload smoke-tested OCI archive and digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keep images outside the MonkeysPaw-release-* asset assembly.
          name: MonkeysPaw-server-image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/server-image/server-${{ matrix.arch }}.tar
            ${{ runner.temp }}/server-image/server-${{ matrix.arch }}.digest
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Remove test container and builder
        if: always()
        run: |
          docker rm --force monkeyspaw-server-release || true
          docker buildx rm monkeyspaw-server-release || true

  publish:
    name: Publish verified draft
    # Both native image builds and smoke tests must pass before publishing.
    needs: [tests, verify, linux, flatpak, macos, android-build, artifacts, server-images]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      DEB_FILE: ${{ needs.linux.outputs.deb_file }}
      BUNDLE_FILE: ${{ needs.flatpak.outputs.bundle_file }}
      APK_FILE: ${{ needs.android-build.outputs.apk_file }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    # No checkout or repository scripts execute with the write-enabled token.
    steps:
      - name: Fetch the verified build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MonkeysPaw-release-*
          merge-multiple: true
          path: dist
      - name: Create draft and attach every asset
        run: |
          for file in "$DEB_FILE" "$DEB_FILE.sha256" \
            "$BUNDLE_FILE" "$BUNDLE_FILE.sha256" \
            "MonkeysPaw-$VERSION.dmg" "MonkeysPaw-$VERSION.zip" "MonkeysPaw-$VERSION.sha256" \
            "$APK_FILE" "$APK_FILE.sha256"; do
            test -f "dist/$file" && test -s "dist/$file"
          done
          shopt -s nullglob dotglob
          files=(dist/*)
          test "${#files[@]}" -eq 9 # Seven desktop assets plus APK/checksum.
          # Require each manifest to cover its exact payloads, once, in package order.
          verify_manifest() {
            local manifest="$1" digest filename
            shift
            local names=()
            while read -r digest filename || [[ -n "$digest" || -n "$filename" ]]; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              names+=("$filename")
            done < "dist/$manifest"
            test "${names[*]}" = "$*"
          }
          verify_manifest "$DEB_FILE.sha256" "$DEB_FILE"
          verify_manifest "$BUNDLE_FILE.sha256" "$BUNDLE_FILE"
          verify_manifest "MonkeysPaw-$VERSION.sha256" "MonkeysPaw-$VERSION.zip" "MonkeysPaw-$VERSION.dmg"
          verify_manifest "$APK_FILE.sha256" "$APK_FILE"
          (cd dist && sha256sum --strict -c "$DEB_FILE.sha256" "$BUNDLE_FILE.sha256" "MonkeysPaw-$VERSION.sha256" "$APK_FILE.sha256")
          cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Android requires API 26 or later. Download the APK and its .apk.sha256 together and verify the checksum before sideloading. The release APK is signed and shrunk with R8.

          Use the Quick Settings tile, launcher shortcut or widget to pick and fill a prompt, then Copy and paste manually in the target app.

          Both Android variants use the same public signing key. The signature does not establish publisher identity; use artifacts from this repository's GitHub Release. See the [signing decision](https://github.com/L-K-M/MonkeysPaw/blob/main/docs/decisions/0001-android-zero-secret-signing.md) and [Android checks](https://github.com/L-K-M/MonkeysPaw/blob/main/docs/platform/android.md).

          The Flatpak bundle requires Linux x86_64, Flatpak and GNOME Platform 50. Download the .flatpak bundle and its .flatpak.sha256 together. Replace <bundle> with the downloaded bundle's filename: verify with `sha256sum -c <bundle>.sha256` before installing with `flatpak install --user ./<bundle>`.

          Use one active native or Flatpak installation per user. Keep your library under your home directory; sandbox delivery uses portals with a copy fallback.
          NOTES
          printf '\n[Release changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GH_REPO" "$RELEASE_TAG" >> "$RUNNER_TEMP/android-release-notes.md"
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --draft \
            --title "Monkey's Paw $VERSION" --generate-notes \
            --notes-file "$RUNNER_TEMP/android-release-notes.md" \
            --prerelease="$PRERELEASE" --latest=false
      - name: Download and byte-compare every draft asset
        run: |
          # GH_TOKEN authorizes draft lookup and downloads from asset API URLs.
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          shopt -s nullglob dotglob
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/release-assets/$(basename "$file")"
          done
          downloaded=("$RUNNER_TEMP/release-assets/"*)
          test "${#downloaded[@]}" -eq 9 # Seven desktop assets plus APK/checksum.
      - name: Publish only after every comparison passes
        run: |
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false \
            --prerelease="$PRERELEASE" --latest="$latest"
