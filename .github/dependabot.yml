version: 2
updates:
  # Shared Core package and its YAML dependency.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Server package dependencies.
  - package-ecosystem: swift
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Server build and runtime container images.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Workflow actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # gradle/actions v6 relicensed its caching component under proprietary
      # terms; stay on the open v5 line like HalloMiao (L-K-M/Blipbird#7).
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
  # Android pins follow HalloMiao; coupled Kotlin and KSP updates stay together.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
