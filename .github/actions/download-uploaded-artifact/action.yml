name: Download the current upload
description: Download the exact artifact returned by a specific upload step
inputs:
  artifact-id:
    description: Artifact ID returned by upload-artifact
    required: true
  path:
    description: Directory for the downloaded files
    required: true
runs:
  using: composite
  steps:
    - name: Require an upload ID
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::The upload did not return a valid artifact ID"
          exit 1
        fi
    - id: download
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ inputs.path }}
    - name: Allow the new upload to become visible
      if: steps.download.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Retry the same upload
      if: steps.download.outcome == 'failure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ inputs.path }}
